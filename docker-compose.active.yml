services:
  postgres:
    image: postgres:17-alpine
    container_name: holihu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: holihu_electionv1
      POSTGRES_USER: holihu
      POSTGRES_PASSWORD: holihu
    ports:
      - "5432:5432"
    volumes:
      - holihu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holihu -d holihu_electionv1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: holihu-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ./blockchain_sm/.env
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:5293
      AppUrl: http://localhost:3000
      AppSettings__DisableHttpsRedirection: "true"
      ConnectionStrings__DefaultConnection: ""
      ConnectionStrings__ElectionV1StoreConnection: Host=postgres;Port=5432;Database=holihu_electionv1;Username=holihu;Password=holihu
      ElectionV1StoreSettings__Provider: postgres
      ElectionV1Settings__ContractsRootPath: /workspace/blockchain_sm
      ElectionV1Settings__RpcUrl: "https://ethereum-sepolia-rpc.publicnode.com"
      DevelopmentAuthSettings__Enabled: "true"
      RecaptchaSettings__Enabled: ${RECAPTCHA_ENABLED:-false}
      RecaptchaSettings__SecretKey: ${RECAPTCHA_SECRET_KEY:-}
      RecaptchaSettings__ScoreThreshold: ${RECAPTCHA_SCORE_THRESHOLD:-0.5}
      JwtSettings__Secret: ${JWT_SECRET:?JWT_SECRET chua duoc dat - tao .env tu .env.example (>=32 ky tu). spec 001/S3}
      JwtSettings__Issuer: HoLiHu.Local
      JwtSettings__Audience: HoLiHu.Local.Client
      JwtSettings__AccessTokenExpirationMinutes: "120"
      JwtSettings__RefreshTokenExpirationDays: "7"
    ports:
      - "5293:5293"
    # S15 (spec 004): persist deployment records qua recreate container.
    volumes:
      - holihu_deployments:/workspace/blockchain_sm/deployments
    # S15: healthcheck de frontend doi backend san sang.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5293/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: holihu-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_BASE_URL: http://localhost:5293
      VITE_RECAPTCHA_ENABLED: ${VITE_RECAPTCHA_ENABLED:-false}
      VITE_RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-}
      VITE_RPC_URL: https://ethereum-sepolia-rpc.publicnode.com
    ports:
      - "3000:3000"

  # S-infra (spec 004): local chain tuỳ chọn (opt-in).
  #   docker compose --profile local-chain up
  # Wiring tự deploy ElectionFactoryV1 lên anvil + set FACTORY_ADDRESS = follow-up.
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: holihu-anvil
    profiles: ["local-chain"]
    entrypoint: ["anvil", "--host", "0.0.0.0", "--chain-id", "31337"]
    ports:
      - "8545:8545"

volumes:
  holihu_postgres_data:
  holihu_deployments:
