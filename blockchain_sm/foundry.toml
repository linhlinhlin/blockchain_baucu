[profile.default]
src = "contracts"
test = "test/foundry"
libs = ["node_modules"]
cache_path = "cache_forge"
out = "out_forge"
remappings = [
  "@openzeppelin/contracts-v5/=node_modules/@openzeppelin/contracts-v5/",
  "@openzeppelin/=node_modules/@openzeppelin/"
]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
